name: Build Customer App
on:
  workflow_dispatch:
    inputs:
      kitchen_id:
        description: 'Kitchen ID'
        required: true
      app_name:
        description: 'App Name'
        required: true
      theme_color:
        description: 'Theme Color (Hex)'
        required: true
      logo_url:
        description: 'Logo Image URL'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Yahan se working-directory hata diya hai kyunki ye root me hi hai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Auto-Generate Flutter Files
        run: flutter create .

      - name: Add Icon Generator Package
        run: flutter pub add dev:flutter_launcher_icons

      - name: Download Logo and Setup Icons
        run: |
          mkdir -p assets
          curl -L "${{ github.event.inputs.logo_url }}" -o assets/app_icon.png
          echo "flutter_icons:" > flutter_launcher_icons.yaml
          echo "  android: true" >> flutter_launcher_icons.yaml
          echo "  ios: true" >> flutter_launcher_icons.yaml
          echo "  image_path: 'assets/app_icon.png'" >> flutter_launcher_icons.yaml
          flutter pub run flutter_launcher_icons:main

      - name: Run App Factory Script
        run: node generate_app.js --id="${{ github.event.inputs.kitchen_id }}" --name="${{ github.event.inputs.app_name }}" --color="${{ github.event.inputs.theme_color }}"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Customer-APK
          # Yahan bhi path theek kar diya hai
          path: build/app/outputs/flutter-apk/app-release.apk        
        with:
          name: ${{ github.event.inputs.app_name }}-Customer-APK
          # Yahan bhi path theek kar diya hai
          path: build/app/outputs/flutter-apk/app-release.apk
